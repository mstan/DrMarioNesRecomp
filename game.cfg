# game.cfg — Dr. Mario (NES, Mapper 1 / MMC1, 2 PRG banks, 4 CHR ROM banks)
output_prefix dr-mario

# Inline dispatch: toAddressAtStackPointer_indexA at $B8B5
# JSR $B8B5 is followed by address table; A register selects entry.
# Pattern: ASL A, TAY, INY, PLA, STA $00, PLA, STA $01, LDA ($00),Y ...
inline_dispatch B8B5

# Bank switch function (MMC1 PRG serial write) — not really used since
# Dr. Mario has only 2 PRG banks (32KB fixed), but the MMC1 control
# register is written at $B8D5.
bank_switch B8D5

# getPointer_fromStack at $B754 — reads 2 inline bytes after JSR as a pointer
# into $00/$01 and returns. NOT a dispatch — caller continues after the 2 bytes.
# getPointer_fromStack at $B754 — reads 2 inline bytes from the OUTER
# caller's return address (via stack[SP+3/4]). In recompiled code, the outer
# caller already loaded $00/$01 via inline_pointer B6CB. $B754's stack
# manipulation corrupts $00/$01, so we skip it entirely.
nop_jsr B754

# copyBkgOrPalToPPU at $B6CB — callers pass 2 inline bytes (data pointer)
# which end up in $00/$01 via B754's stack read. In recompiled code, we load
# $00/$01 directly from the inline data and call the function.
inline_pointer B6CB 00 01 call

# Mid-instruction entry: $B725 branches to $B6D1, the second byte of LAX at $B6D0.
# Byte $48 at $B6D1 = PHA when entered directly. Classic 6502 "skip byte" trick.
extra_label 0 B6D1

# Dispatch misses — only addresses in ROM range ($8000+) are valid code
extra_func -1 A989
extra_func -1 85C7
extra_func -1 8889
extra_func -1 BE67
extra_func 0 8594
extra_func 0 B6CB
extra_func 0 8D60
extra_func 0 A660
extra_func -1 DDDC
